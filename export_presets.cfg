html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"mobile-web-app-capable\" content=\"yes\">
<script>
(function () {
  // iPhone: Ton auch bei Stummschalter wie Musik-App behandeln (Safari 17+)
  try { if (navigator.audioSession) { navigator.audioSession.type = \"playback\"; } } catch (e) {}
  var ctxs = [];
  var Orig = window.AudioContext || window.webkitAudioContext;
  if (Orig) {
    var W = class extends Orig { constructor(o) { super(o); ctxs.push(this); } };
    window.AudioContext = W;
    if (window.webkitAudioContext) { window.webkitAudioContext = W; }
  }
  // Safari startet Web-Audio nur in einer Berührung: bei jeder Berührung fortsetzen und einen stillen Ton spielen
  function unlock() {
    for (var i = 0; i < ctxs.length; i++) {
      var c = ctxs[i];
      if (c.state !== \"running\") { try { c.resume(); } catch (e) {} }
      try { var b = c.createBuffer(1, 1, 22050); var s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) {}
    }
  }
  [\"touchstart\", \"touchend\", \"pointerdown\", \"pointerup\", \"click\", \"keydown\"].forEach(function (n) { document.addEventListener(n, unlock, true); });
  document.addEventListener(\"visibilitychange\", function () { if (!document.hidden) { unlock(); } });
})();
</script>"
