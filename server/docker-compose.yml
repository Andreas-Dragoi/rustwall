# Rustwall-Server: Nakama + PostgreSQL + Caddy (HTTPS mit automatischem Zertifikat).
# Anleitung: server/README.md. Geheimnisse stehen in server/.env (Vorlage: .env.beispiel) – diese Datei nie hochladen.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datenbank:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 5s
      retries: 10

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.25.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./modules:/nakama/data/modules:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf 'runtime:\n  js_entrypoint: "build/index.js"\n  env:\n    - "ALLOW_TEST_PURCHASES=%s"\n    - "TELEMETRY_SALT=%s"\n    - "APPLE_SHARED_SECRET=%s"\n    - "GOOGLE_CLIENT_EMAIL=%s"\n    - "GOOGLE_PRIVATE_KEY=%s"\n' \
          "$$ALLOW_TEST_PURCHASES" "$$TELEMETRY_SALT" "$$APPLE_SHARED_SECRET" "$$GOOGLE_CLIENT_EMAIL" "$$GOOGLE_PRIVATE_KEY" > /tmp/rustwall.yml
        /nakama/nakama migrate up --database.address "postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama"
        exec /nakama/nakama --config /tmp/rustwall.yml --name rustwall \
          --database.address "postgres:$$POSTGRES_PASSWORD@postgres:5432/nakama" \
          --logger.level INFO \
          --socket.server_key "$$SERVER_KEY" \
          --session.encryption_key "$$SESSION_KEY" --session.refresh_encryption_key "$$REFRESH_KEY" \
          --session.token_expiry_sec 7200 --session.refresh_token_expiry_sec 5184000 \
          --runtime.http_key "$$HTTP_KEY" \
          --console.username admin --console.password "$$CONSOLE_PASSWORD" \
          --iap.apple.shared_password "$$APPLE_SHARED_SECRET"
    expose:
      - "7350"
    ports:
      - "127.0.0.1:7351:7351"     # Verwaltungsseite nur über SSH-Tunnel erreichbar (siehe README)
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - nakama
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to nakama:7350
    volumes:
      - zertifikate:/data

volumes:
  datenbank:
  zertifikate:
